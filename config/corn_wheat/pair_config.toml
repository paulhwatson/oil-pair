# Corn vs Chicago wheat: substitutes in animal feed, so when one gets cheap
# relative to the other, feed buyers switch. Chosen from the physical-link
# screen (2026-10-10): ~29 months of Yahoo data positive at all 27 settings in
# both halves (+£220/month median). Both trade on CBOT with the same delivery
# months, so Yahoo's front-month rolls line up and don't flatter it. IG's own
# 3 months are positive at all 27 settings overall (+£54/month median) but
# hold only ~3 trades at a 2.0 entry - too few to confirm either way.
# Thresholds are mid-table on both data sets (9th of 27 on each), not the
# best, and match soybeans_soymeal. Sized by config/risk.toml. Grains trade
# ~17 hours a day on IG (CBOT's overnight and day sessions).

[instrument_a]
epic = "CC.D.C.USS.IP"
fmp_symbol = "CUSD"
name = "Corn"
expiry = "DFB"
currency_code = "GBP"

[instrument_b]
epic = "CC.D.W.USS.IP"
fmp_symbol = "WUSD"
name = "Chicago Wheat"
expiry = "DFB"
currency_code = "GBP"

[strategy]
notional_trade_size = 3000
model_update_interval_business_days = 7
entry_stds = 2.0
limit_stds = 0.5
stop_stds = 5.5
poll_interval_seconds = 15
warmup_minutes = 1440
max_fit_lookback_days = 30
